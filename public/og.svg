  </g>
  <!-- Club name -->
  <text x="260" y="300" font-family="serif" font-size="72" fill="#F5EDE0" letter-spacing="6">FERRARI CLUB</text>
  <text x="260" y="385" font-family="serif" font-size="72" fill="#CC0000" letter-spacing="6">ESPAÑA</text>
  <text x="262" y="440" font-family="monospace" font-size="22" fill="rgba(245,237,224,.55)" letter-spacing="8">CLUB OFICIAL DESDE 1988</text>
  <!-- Bottom line -->
  <rect y="624" width="1200" height="6" fill="url(#line)"/>
  <defs>
    <linearGradient id="line" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#CC0000" stop-opacity="0"/>
      <stop offset="30%" stop-color="#CC0000"/>
      <stop offset="70%" stop-color="#C49A3C"/>
